# Сборка Android-приложения «Предписания СП» из файлов сайта.
# Запускается при каждой загрузке файлов в main или вручную (Actions → Android APK → Run workflow).
# Готовый файл APK появляется в разделе Releases репозитория.
name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['index.html', 'data.enc', 'icon-1024.png', '.github/workflows/android.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Файлы приложения
        run: |
          mkdir -p www
          cp index.html manifest.webmanifest icon-192.png icon-512.png data.enc data-version.txt www/
      - name: Оболочка Capacitor
        run: |
          npm init -y >/dev/null
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/share@6 @capacitor/filesystem@6
          npx cap init "Предписания СП" ru.predpisaniya.sp --web-dir www
          npx cap add android
      - name: Иконка
        continue-on-error: true
        run: |
          mkdir -p assets
          cp icon-1024.png assets/icon-only.png
          cp icon-1024.png assets/icon-foreground.png
          npx --yes @capacitor/assets@3 generate --android --iconBackgroundColor '#0b2c5c' --iconBackgroundColorDark '#0b2c5c'
      - name: Разрешение камеры
        run: |
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.CAMERA" />#' android/app/src/main/AndroidManifest.xml
          grep -n permission android/app/src/main/AndroidManifest.xml
      - name: Сборка APK
        run: |
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../Predpisaniya-SP.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Predpisaniya-SP-apk
          path: Predpisaniya-SP.apk
      - name: Выложить в Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Предписания СП — Android, сборка ${{ github.run_number }}
          files: Predpisaniya-SP.apk
